name: Bug report
description: Report a reproducible defect in HEZQEN.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, API keys, personal data or private research evidence. Report security vulnerabilities privately using SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Public website
        - HEZQEN Labs
        - Payload CMS
        - Editorial workflow
        - Research and evidence
        - Build or CI
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
      placeholder: A clear, concise description.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reproducible sequence.
      placeholder: |
        1. Start ...
        2. Open ...
        3. Perform ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit, version or deployment
      placeholder: Commit SHA, release tag or preview URL
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS, Node.js, pnpm and browser/runtime versions where relevant.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove credentials, personal data and private evidence before attaching.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I removed secrets and sensitive information.
          required: true
        - label: This is not a security vulnerability report.
          required: true
