name: Refresh pnpm lockfile

on:
  push:
    branches:
      - "deps/lockfile-*"

permissions:
  contents: write

concurrency:
  group: lockfile-refresh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - run: corepack enable
      - run: pnpm install --lockfile-only --no-frozen-lockfile --ignore-scripts
      - name: Commit regenerated lockfile
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git check-ref-format --branch "$BRANCH"
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(deps): refresh pnpm lockfile"
          git push origin "HEAD:$BRANCH"
