name: Payload migration verification

on:
  pull_request:
    paths:
      - "src/migrations/**"
      - "src/payload.config.ts"
      - "src/collections/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.7-alpine
        env:
          POSTGRES_USER: hezqen_ci
          POSTGRES_PASSWORD: hezqen_ci
          POSTGRES_DB: hezqen_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hezqen_ci -d hezqen_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to ephemeral PostgreSQL
        run: pnpm payload migrate
        env:
          DATABASE_URL: postgres://hezqen_ci:hezqen_ci@127.0.0.1:5432/hezqen_ci
          PAYLOAD_SECRET: ci-only-secret-never-use-outside-builds
          NEXT_PUBLIC_SITE_URL: https://hezqen.tinlance.com
          HEZQEN_ALLOWED_ORIGINS: https://hezqen.tinlance.com
      - name: Verify guarded backup and restore on ephemeral PostgreSQL
        env:
          DATABASE_URL: postgres://hezqen_ci:hezqen_ci@127.0.0.1:5432/hezqen_ci
          RESTORE_DATABASE_URL: postgres://hezqen_ci:hezqen_ci@127.0.0.1:5432/hezqen_restore_smoke
          BACKUP_FILE: /backup/hezqen.dump
          HEZQEN_RESTORE_ENV: ci
          HEZQEN_RESTORE_APPROVED: "true"
          HEZQEN_RESTORE_CONFIRM_TARGET: ci
        run: |
          mkdir -p "$RUNNER_TEMP/hezqen-backup"
          docker run --rm --network host \
            --env DATABASE_URL \
            --env RESTORE_DATABASE_URL \
            --env BACKUP_FILE \
            --env HEZQEN_RESTORE_ENV \
            --env HEZQEN_RESTORE_APPROVED \
            --env HEZQEN_RESTORE_CONFIRM_TARGET \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --volume "$RUNNER_TEMP/hezqen-backup:/backup" \
            --workdir /workspace \
            postgres:18.7-alpine sh scripts/db/backup-restore-smoke.sh
      - name: Verify migration status
        run: pnpm payload migrate:status
        env:
          DATABASE_URL: postgres://hezqen_ci:hezqen_ci@127.0.0.1:5432/hezqen_ci
          PAYLOAD_SECRET: ci-only-secret-never-use-outside-builds
          NEXT_PUBLIC_SITE_URL: https://hezqen.tinlance.com
          HEZQEN_ALLOWED_ORIGINS: https://hezqen.tinlance.com
