name: Payload migration verification

on:
  pull_request:
    paths:
      - "src/migrations/**"
      - "src/payload.config.ts"
      - "src/collections/**"
      - "package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  postgres-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hezqen_ci
          POSTGRES_PASSWORD: hezqen_ci
          POSTGRES_DB: hezqen_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hezqen_ci -d hezqen_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.3
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to ephemeral PostgreSQL
        run: pnpm payload migrate
        env:
          DATABASE_URL: postgres://hezqen_ci:hezqen_ci@127.0.0.1:5432/hezqen_ci
          PAYLOAD_SECRET: ci-only-secret-never-use-outside-builds
          NEXT_PUBLIC_SITE_URL: https://hezqen.tinlance.com
          HEZQEN_ALLOWED_ORIGINS: https://hezqen.tinlance.com
      - name: Verify migration status
        run: pnpm payload migrate:status
        env:
          DATABASE_URL: postgres://hezqen_ci:hezqen_ci@127.0.0.1:5432/hezqen_ci
          PAYLOAD_SECRET: ci-only-secret-never-use-outside-builds
          NEXT_PUBLIC_SITE_URL: https://hezqen.tinlance.com
          HEZQEN_ALLOWED_ORIGINS: https://hezqen.tinlance.com
