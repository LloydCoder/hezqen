name: HEZQEN Cloudflare Compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "next.config.*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - ".github/workflows/cloudflare-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vinext-check:
    name: Check Next.js compatibility with Cloudflare vinext
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.3
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Run pinned Cloudflare vinext compatibility check
        run: pnpm dlx vinext@1.4.5 check
