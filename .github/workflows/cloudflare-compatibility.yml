name: HEZQEN Cloudflare Compatibility

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "next.config.*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "docs/INFRASTRUCTURE_DISCOVERY.md"
      - ".github/workflows/cloudflare-compatibility.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "src/**"
      - "next.config.*"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.json"
      - "docs/INFRASTRUCTURE_DISCOVERY.md"
      - ".github/workflows/cloudflare-compatibility.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vinext-check:
    name: Check Next.js compatibility with Cloudflare vinext
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.3
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Run pinned Cloudflare vinext compatibility check
        run: pnpm dlx vinext@1.4.5 check

  vinext-worker-build:
    name: Build and smoke-test the Cloudflare Worker locally
    needs: vinext-check
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hezqen_ci
          POSTGRES_PASSWORD: hezqen_ci
          POSTGRES_DB: hezqen_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hezqen_ci -d hezqen_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.3
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Initialize Cloudflare Workers build in the ephemeral checkout
        run: pnpm dlx vinext@1.4.5 init --platform=cloudflare --name=hezqen --cdn-cache=none --data-cache=none --image-optimization=none --no-prerender
      - name: Inspect generated Cloudflare runtime configuration
        run: |
          echo "Wrangler configuration candidates:"
          find . -path ./node_modules -prune -o -type f -name "wrangler*" -print | head -n 30
          if [ -f vite.config.ts ]; then
            echo "Generated Vite configuration:"
            sed -n '1,240p' vite.config.ts
          fi
          if [ -f cloudflare.config.ts ]; then
            echo "Generated Cloudflare configuration:"
            sed -n '1,260p' cloudflare.config.ts
          fi
      - name: Declare HEZQEN Worker bindings
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("cloudflare.config.ts")
          source = path.read_text()
          flags = 'compatibilityFlags: ["nodejs_compat", "nodejs_compat_populate_process_env"]'
          if "nodejs_compat_populate_process_env" not in source:
              flags_match = re.search(r'compatibilityFlags\s*:\s*\[[^\]]*\]', source)
              if flags_match:
                  source = source[:flags_match.start()] + flags + source[flags_match.end():]
              else:
                  date_match = re.search(r'(\s*compatibilityDate:\s*["\'][^"\']+["\'],)', source)
                  if date_match:
                      source = source[:date_match.end()] + "\n    " + flags + "," + source[date_match.end():]
                  else:
                      worker_match = re.search(r'(worker\s*:\s*(?:defineWorker\()?\\{)', source)
                      if not worker_match:
                          raise SystemExit("Generated cloudflare.config.ts has no worker config block")
                      source = source[:worker_match.end()] + '\n    compatibilityDate: "2026-11-15",\n    ' + flags + "," + source[worker_match.end():]
          env_match = re.search(r'(\s*env:\s*\{)', source)
          if not env_match:
              raise SystemExit("Generated cloudflare.config.ts has no worker env block")
          required = {
              "DATABASE_URL": "bindings.secret()",
              "PAYLOAD_SECRET": "bindings.secret()",
              "NEXT_PUBLIC_SITE_URL": 'bindings.text("http://localhost:3001")',
              "HEZQEN_ALLOWED_ORIGINS": 'bindings.text("http://localhost:3001")',
          }
          for name, binding in required.items():
              if f"{name}:" not in source:
                  source = source[:env_match.end()] + f"\n      {name}: {binding}," + source[env_match.end():]
                  env_match = re.search(r'(\s*env:\s*\{)', source)
          path.write_text(source)
          for name in required:
              if f"{name}:" not in path.read_text():
                  raise SystemExit(f"Missing required Worker binding: {name}")
          print(path.read_text())
          PY
      - name: Install generated Worker toolchain
        # workerd is the Cloudflare Workers runtime; explicitly approve only this reviewed native build.
        run: pnpm install --no-frozen-lockfile --allow-build=workerd
      - name: Apply Payload migrations to ephemeral PostgreSQL
        run: pnpm payload migrate
        env:
          DATABASE_URL: postgres://hezqen_ci:hezqen_ci@127.0.0.1:5432/hezqen_ci
          PAYLOAD_SECRET: ci-only-secret-never-use-outside-builds
          NEXT_PUBLIC_SITE_URL: http://localhost:3001
          HEZQEN_ALLOWED_ORIGINS: http://localhost:3001
      - name: Provide isolated production-mode Worker preview bindings
        # Vite plugin v2 preview reuses the mode recorded at build time; use a temporary production-mode env file.
        run: |
          umask 077
          cat > .env.production <<'EOF'
          DATABASE_URL=postgres://hezqen_ci:hezqen_ci@127.0.0.1:5432/hezqen_ci
          PAYLOAD_SECRET=ci-only-secret-never-use-outside-builds
          EOF
      - name: Build Cloudflare Worker
        run: pnpm run build:vinext
        env:
          DATABASE_URL: postgres://hezqen_ci:hezqen_ci@127.0.0.1:5432/hezqen_ci
          PAYLOAD_SECRET: ci-only-secret-never-use-outside-builds
          NEXT_PUBLIC_SITE_URL: http://localhost:3001
          HEZQEN_ALLOWED_ORIGINS: http://localhost:3001
      - name: Run Worker locally and smoke-test public and CMS routes
        run: |
          pnpm run start:vinext --host 0.0.0.0 --port 3001 > /tmp/hezqen-vinext.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 45); do
            if curl --max-time 2 --fail --silent http://127.0.0.1:3001/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            ss -ltnp || true
            cat /tmp/hezqen-vinext.log
            exit 1
          fi
          for route in / /about /editorial-standards /labs /labs/vram /labs/ai-cost /labs/rag-storage /labs/ai-data-risk /labs/hardware-roi /labs/finetune-vs-rag /labs/cloud-migration /labs/kubernetes-cost /labs/database-capacity /labs/api-pricing /labs/inference-throughput /labs/incident-cost /labs/saas-margin /labs/datacenter-energy /labs/storage-growth /labs/agent-cost /divisions/ai-technology /robots.txt /sitemap.xml /admin /api/articles; do
            echo "Checking $route"
            status=$(curl --max-time 10 --silent --output /tmp/hezqen-vinext-response --write-out "%{http_code}" "http://127.0.0.1:3001$route")
            if [ "$status" != "200" ]; then
              echo "Unexpected HTTP $status for $route"
              cat /tmp/hezqen-vinext-response
              cat /tmp/hezqen-vinext.log
              exit 1
            fi
          done
        env:
          DATABASE_URL: postgres://hezqen_ci:hezqen_ci@127.0.0.1:5432/hezqen_ci
          PAYLOAD_SECRET: ci-only-secret-never-use-outside-builds
          NEXT_PUBLIC_SITE_URL: http://localhost:3001
          HEZQEN_ALLOWED_ORIGINS: http://localhost:3001
