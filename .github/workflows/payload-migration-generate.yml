name: Generate Payload migration

on:
  push:
    branches:
      - "db/migration-*"

permissions:
  contents: write

concurrency:
  group: payload-migration-generation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hezqen_ci
          POSTGRES_PASSWORD: hezqen_ci
          POSTGRES_DB: hezqen_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hezqen_ci -d hezqen_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.22.3
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Generate initial migration
        run: pnpm payload migrate:create initial --skip-empty
        env:
          DATABASE_URL: postgres://hezqen_ci:hezqen_ci@127.0.0.1:5432/hezqen_ci
          PAYLOAD_SECRET: ci-only-secret-never-use-outside-builds
          NEXT_PUBLIC_SITE_URL: https://hezqen.tinlance.com
          HEZQEN_ALLOWED_ORIGINS: https://hezqen.tinlance.com
      - name: Commit generated migration
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git check-ref-format --branch "$BRANCH"
          if [ ! -d src/migrations ] || [ -z "$(find src/migrations -type f -name '*.ts' -print -quit)" ]; then
            echo "Payload did not generate a migration file."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/migrations
          if git diff --cached --quiet; then
            echo "No migration changes were generated."
            exit 1
          fi
          git commit -m "chore(db): generate initial Payload migration"
          git push origin "HEAD:$BRANCH"
