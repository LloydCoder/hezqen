name: Generate Payload migration

on:
  push:
    branches:
      - "db/migration-*"

permissions:
  contents: write

concurrency:
  group: payload-migration-generation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: hezqen_ci
          POSTGRES_PASSWORD: hezqen_ci
          POSTGRES_DB: hezqen_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hezqen_ci -d hezqen_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Check whether an initial migration already exists
        id: migration-state
        run: |
          if find src/migrations -type f -name '*.ts' ! -name 'index.ts' -print -quit 2>/dev/null | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate initial migration
        if: steps.migration-state.outputs.exists == 'false'
        run: pnpm payload migrate:create initial --skip-empty
        env:
          DATABASE_URL: postgres://hezqen_ci:hezqen_ci@127.0.0.1:5432/hezqen_ci
          PAYLOAD_SECRET: ci-only-secret-never-use-outside-builds
          NEXT_PUBLIC_SITE_URL: https://hezqen.tinlance.com
          HEZQEN_ALLOWED_ORIGINS: https://hezqen.tinlance.com
      - name: Format generated migrations
        run: pnpm dlx @biomejs/biome@2.6.7 format --write src/migrations
      - name: Commit generated migration
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git check-ref-format --branch "$BRANCH"
          if [ ! -d src/migrations ] || [ -z "$(find src/migrations -type f -name '*.ts' -print -quit)" ]; then
            echo "Payload did not generate a migration file."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/migrations
          if git diff --cached --quiet; then
            echo "No migration changes to commit."
          else
            git commit -m "chore(db): generate initial Payload migration"
            git push origin "HEAD:$BRANCH"
          fi
