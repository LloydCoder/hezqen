name: One-time HEZQEN Labs formatting
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  format-labs:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/hezqen-labs-14-calculators'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm dlx @biomejs/biome@2.6.7 format --write app src package.json biome.json next.config.ts next-env.d.ts tsconfig.json
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app src package.json biome.json next.config.ts next-env.d.ts tsconfig.json
            git commit -m "style(labs): apply repository formatter"
            git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
          fi
