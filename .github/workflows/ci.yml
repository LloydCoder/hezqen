name: HEZQEN CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm test
      - run: pnpm audit --audit-level moderate
      - run: pnpm run build
        env:
          DATABASE_URL: postgres://hezqen_ci:hezqen_ci@127.0.0.1:5432/hezqen_ci
          PAYLOAD_SECRET: ci-only-secret-never-use-outside-builds
          NEXT_PUBLIC_SITE_URL: https://hezqen.tinlance.com
          HEZQEN_ALLOWED_ORIGINS: https://hezqen.tinlance.com
      - run: pnpm run typecheck
