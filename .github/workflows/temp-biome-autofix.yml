name: Temporary Biome formatting pass

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.3
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Format changed source files
        shell: bash
        run: |
          git fetch origin "${{ github.event.pull_request.base.ref }}"
          files="$(git diff --name-only "origin/${{ github.event.pull_request.base.ref }}"...HEAD | grep -E '\\.(ts|tsx|js|mjs|json|jsonc)$' || true)"
          if [ -n "$files" ]; then
            printf '%s\\n' "$files" | xargs -r pnpm dlx @biomejs/biome@2.6.7 format --write
          fi
      - name: Commit formatting changes
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "style: apply Biome formatting"
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
